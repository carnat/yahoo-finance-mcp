name = "yahoo-finance-mcp"
main = "src/index.ts"
compatibility_date = "2024-11-01"
preview_urls = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
MCP_ENVELOPE_V2 = "true"
SERVER_VERSION = "1.5.0"
BUILD_VERSION = ""
BUILD_DATE = ""
BUILD_SHA = ""
DEPLOYED_AT = ""

# Smart Placement routes Worker execution to the Cloudflare PoP geographically
# closest to its outbound dependencies (e.g. data.sec.gov in US-East), which
# reduces latency and improves reliability of EDGAR fetch calls.
[placement]
mode = "smart"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
