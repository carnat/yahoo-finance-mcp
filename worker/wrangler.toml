name = "yahoo-finance-mcp"
main = "src/index.ts"
compatibility_date = "2026-09-21"
# AsyncLocalStorage (node:async_hooks) attributes Yahoo cache use to each request.
compatibility_flags = ["nodejs_als"]
preview_urls = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
MCP_ENVELOPE_V2 = "true"
SERVER_VERSION = "2.5.0"
BUILD_VERSION = ""
BUILD_DATE = ""
BUILD_SHA = ""
DEPLOYED_AT = ""
# SEC EDGAR fair-access policy requires a reachable contact in the User-Agent.
# The deploy workflow passes the EDGAR_CONTACT_EMAIL GitHub Actions secret
# through as a Worker secret; requests fall back to a placeholder contact
# when it is unset.

# Evidence cuts and daily consensus observations (2.5.0): a private R2 bucket,
# written once per content-addressed key. Tools run without it and report
# storageStatus UNAVAILABLE.
[[r2_buckets]]
binding = "EVIDENCE_BUCKET"
bucket_name = "yfmcp-evidence"

# Smart Placement routes Worker execution to the Cloudflare PoP geographically
# closest to its outbound dependencies (e.g. data.sec.gov in US-East), which
# reduces latency and improves reliability of EDGAR fetch calls.
[placement]
mode = "smart"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
