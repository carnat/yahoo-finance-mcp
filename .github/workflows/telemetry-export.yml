name: Telemetry export

# Daily export of the Worker's privacy-minimised telemetry (2.11.1, R4 Q10):
# aggregates only, from Workers Analytics Engine and Workers Logs (3-day
# retention on Free, hence daily). Skips with a notice until the
# CLOUDFLARE_TELEMETRY_TOKEN secret exists.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telemetry-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check telemetry secrets
        id: secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TELEMETRY_TOKEN: ${{ secrets.CLOUDFLARE_TELEMETRY_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_TELEMETRY_TOKEN" ]; then
            echo "::notice title=Telemetry export skipped::CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_TELEMETRY_TOKEN is not set; nothing was exported."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Export the last 24 hours
        if: steps.secrets.outputs.present == 'true'
        run: python scripts/export_telemetry.py --out-dir telemetry
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TELEMETRY_TOKEN: ${{ secrets.CLOUDFLARE_TELEMETRY_TOKEN }}

      - name: Upload telemetry artifact
        if: always() && steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telemetry-${{ github.run_id }}
          path: telemetry/*.json
          retention-days: 90
          if-no-files-found: warn
