name: Delete Merged Branches (one-off)

# One-off cleanup (2026-09-30): deletes remote branches whose work is already in main.
# Listed: 48 merged into main, 2 whose merge would change nothing, 139 whose tip is in a
# merged PR, codex/official-ir-rss-news (its one extra commit is in main) and
# codex/alpaca-overnight-provider-local (same commit as merged PR #112).
# A branch is deleted only if it still points at the commit recorded here; one pushed to
# since is skipped. Run with dry_run first. Restore a branch with
#   git push origin <sha>:refs/heads/<branch>
# Remove this workflow once it has run.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete listed branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          deleted=0; would=0; gone=0; changed=0; failed=0
          while read -r sha branch; do
            [ -z "$branch" ] && continue
            case "$branch" in
              main|claude/busy-carson-yfxx5n|automation/ir-source-review)
                echo "::error::refusing to delete $branch"; exit 1 ;;
            esac
            current=$(gh api "repos/$REPO/git/ref/heads/$branch" --jq .object.sha 2>/dev/null || true)
            if [ -z "$current" ]; then echo "already gone: $branch"; gone=$((gone+1)); continue; fi
            if [ "$current" != "$sha" ]; then echo "::warning::skipped, pushed to since: $branch"; changed=$((changed+1)); continue; fi
            if [ "$DRY_RUN" = "true" ]; then echo "would delete: $branch"; would=$((would+1)); continue; fi
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null; then
              echo "deleted: $branch"; deleted=$((deleted+1))
            else
              echo "::warning::could not delete: $branch"; failed=$((failed+1))
            fi
          done <<'LIST'
